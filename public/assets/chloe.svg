<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe0ff"/>
      <stop offset="1" stop-color="#c3a3ff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8562f"/>
      <stop offset="1" stop-color="#9c3b1f"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2774a"/>
      <stop offset="1" stop-color="#c8562f"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- hair behind the shoulders -->
    <path d="M118 236 C108 150 168 84 258 84 C350 84 410 150 398 244 C392 300 414 352 432 408 L432 512 L84 512 L84 410 C104 356 124 300 118 236 Z" fill="url(#hair)"/>
    <!-- shoulders and top -->
    <path d="M96 512 C100 430 160 392 256 392 C352 392 412 430 416 512 Z" fill="#2f2460"/>
    <path d="M206 392 L256 452 L306 392 Z" fill="#f2c4a2"/>
    <!-- neck -->
    <path d="M218 330 L218 398 C232 418 280 418 294 398 L294 330 Z" fill="#efbf9c"/>
    <path d="M218 352 C240 372 272 372 294 352 L294 330 L218 330 Z" fill="#e2a985"/>
    <!-- ears -->
    <ellipse cx="166" cy="262" rx="12" ry="20" fill="#f2c4a2"/>
    <ellipse cx="346" cy="262" rx="12" ry="20" fill="#f2c4a2"/>
        <!-- face -->
    <path d="M168 226 C168 158 206 126 256 126 C306 126 344 158 344 226 C344 300 306 352 256 352 C206 352 168 300 168 226 Z" fill="#f6d1b5"/>
    <!-- side-swept fringe with a parting on her right -->
    <path d="M166 232 C156 160 198 112 252 106 C300 101 346 128 356 184 C344 170 322 156 298 150 C276 182 240 206 196 212 C184 214 174 222 166 232 Z" fill="url(#hairLight)"/>
    <path d="M298 150 C322 160 346 180 358 214 C362 176 350 140 318 120 C312 132 306 142 298 150 Z" fill="#b8492a"/>
    <path d="M206 150 C230 136 262 128 290 132" stroke="#ee915e" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- side locks falling in front of the ears -->
    <path d="M168 214 C150 252 150 300 160 338 C168 368 160 400 142 428 C176 412 192 380 190 344 C188 304 178 262 176 214 Z" fill="url(#hair)"/>
    <path d="M344 206 C362 250 364 300 352 340 C344 370 352 402 372 428 C336 414 320 382 322 344 C324 304 334 258 336 206 Z" fill="url(#hair)"/>
    <!-- eyebrows -->
    <path d="M196 226 C210 216 228 216 240 222" stroke="#a5452a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M272 222 C284 216 302 216 316 226" stroke="#a5452a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <ellipse cx="219" cy="252" rx="11" ry="13" fill="#2d3b2f"/>
    <ellipse cx="293" cy="252" rx="11" ry="13" fill="#2d3b2f"/>
    <circle cx="223" cy="247" r="3.5" fill="#ffffff"/>
    <circle cx="297" cy="247" r="3.5" fill="#ffffff"/>
    <!-- cheeks and freckles -->
    <ellipse cx="200" cy="292" rx="22" ry="13" fill="#f2a08c" opacity="0.45"/>
    <ellipse cx="312" cy="292" rx="22" ry="13" fill="#f2a08c" opacity="0.45"/>
    <g fill="#d48a62">
      <circle cx="232" cy="280" r="2.6"/><circle cx="244" cy="288" r="2.2"/><circle cx="226" cy="291" r="2.2"/>
      <circle cx="280" cy="280" r="2.6"/><circle cx="268" cy="288" r="2.2"/><circle cx="286" cy="291" r="2.2"/>
    </g>
    <!-- nose and smile -->
    <path d="M256 262 C252 278 250 288 258 292" stroke="#d99c7c" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M226 312 C244 332 270 332 288 312" stroke="#b84d45" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
