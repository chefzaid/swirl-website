sonar.projectKey=swirlit:website
sonar.projectName=Website
sonar.sourceEncoding=UTF-8
sonar.sources=app,components,data,db,runtime,scripts,server,src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.astro/**,**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,db/**,src/**/*.astro,**/*.css
