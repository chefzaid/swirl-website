sonar.projectKey=swirlit:swirl-website
sonar.projectName=Swirl Website
sonar.sourceEncoding=UTF-8
sonar.sources=app,components,data,db,runtime,scripts,server,src
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.test.ts,e2e/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.astro/**,**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,db/**,src/**/*.astro,**/*.css
