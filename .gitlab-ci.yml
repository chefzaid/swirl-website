workflow:
  rules:
    - if: '$SONAR_SCAN_ONLY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - image
  - release

default:
  tags:
    - swirl-cloud
  interruptible: true

variables:
  GIT_DEPTH: "0"
  SONAR_SCAN_ONLY: "false"
  APP_ONBOARDING: "false"
  SONAR_HOST_URL: "http://sonarqube.infra.svc.cluster.local:9000"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  REGISTRY_PUSH_HOST: gitlab-registry.swirl.internal:5050
  REGISTRY_PULL_IMAGE: registry.swirlit.dev/swirl/swirl-website/site
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
  KANIKO_EXECUTOR: /kaniko/executor

verify:
  stage: verify
  image: node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
  cache:
    key:
      files:
        - package-lock.json
      prefix: swirl-website-npm
    paths:
      - .cache/npm/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 python3-yaml git jq ca-certificates
  script:
    - npm ci --no-fund --prefer-offline
    - npm run check
    - npm run lint
    - npm run format:check
    - npm run test:coverage
    - npm run build
    - python3 scripts/check-built-security.py
    - python3 scripts/check-built-seo.py
    - npm audit --audit-level=high
    - bash infra/scripts/test-delivery.sh
    - python3 infra/scripts/test-onboarding.py
  artifacts:
    when: always
    name: swirl-website-build-$CI_COMMIT_SHORT_SHA
    expire_in: 7 days
    paths:
      - dist/
      - coverage/

e2e:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  needs:
    - job: verify
      artifacts: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: swirl-website-npm
    paths:
      - .cache/npm/
    policy: pull
  script:
    - npm ci --no-fund --prefer-offline
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e-results/
    reports:
      junit: e2e-results/junit.xml

image-build:
  stage: image
  image:
    name: "$KANIKO_IMAGE"
    entrypoint: [""]
  needs:
    - job: verify
      artifacts: true
    - job: e2e
      artifacts: false
  script:
    - sh infra/scripts/ci-build-image.sh
  artifacts:
    name: swirl-website-image-$CI_COMMIT_SHORT_SHA
    expire_in: 7 days
    paths:
      - image-digest.txt
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release:
  stage: release
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  needs:
    - job: image-build
      artifacts: true
  resource_group: swirl-website-production
  interruptible: false
  before_script:
    - apk add --no-cache bash ca-certificates curl git jq kubectl python3
  script:
    - bash infra/scripts/ci-release.sh
  artifacts:
    name: swirl-website-release-$CI_COMMIT_SHORT_SHA
    when: always
    expire_in: 7 days
    paths:
      - release.env
  environment:
    name: production
    url: https://swirlit.dev
    deployment_tier: production
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonar:
  stage: verify
  image: node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
  needs:
    - job: verify
      artifacts: true
  cache:
    key: swirl-website-sonar-v1
    paths:
      - .cache/sonar/cache/
  before_script:
    - npm ci --no-fund --prefer-offline
    - npm install --global @sonar/scan@5.0.0
  script:
    - bash infra/scripts/test-quality.sh
    - bash infra/scripts/ci-quality.sh
  allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - quality-reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
