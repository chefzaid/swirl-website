workflow:
  name: "$CI_PROJECT_NAME: $PIPELINE_MODE pipeline"
  rules:
    - if: '$SONAR_SCAN_ONLY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - verify
  - release
  - version

default:
  tags:
    - swirl-cloud
  interruptible: true

variables:
  GIT_DEPTH: "0"
  SONAR_SCAN_ONLY: "false"
  APP_ONBOARDING: "false"
  PIPELINE_MODE:
    value: "standard"
    options:
      - "standard"
      - "full"
    description: "Use full to run the non-blocking quality/security reports and release/deploy without a manual step."
  NEW_MAJOR_VERSION:
    value: ""
    description: "Major version number for the manual set-major-version job (for example: 2)."
  SONAR_HOST_URL: "http://sonarqube.infra.svc.cluster.local:9000"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  REGISTRY_PUSH_HOST: gitlab-registry.swirl.internal:5050
  REGISTRY_PULL_IMAGE: registry.swirlit.dev/swirl/swirl-website/site
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
  KANIKO_EXECUTOR: "$CI_PROJECT_DIR/.cache/kaniko/executor"

01-build:
  stage: build
  image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  cache:
    - key: swirl-website-npm-v1
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash git jq kubectl python3 py3-yaml
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh build
  artifacts:
    name: "swirl-website-build-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - dist/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

02-test:
  stage: build
  needs:
    - job: 01-build
      artifacts: false
  image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  cache:
    - key: swirl-website-npm-v1
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash git
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh test
  artifacts:
    name: "swirl-website-tests-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - coverage/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

03-package:
  stage: build
  needs:
    - job: 01-build
      artifacts: true
    - job: 02-test
      artifacts: false
  image:
    name: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: [""]
  cache:
    - key: swirl-website-kaniko-executor-v1
      paths:
        - .cache/kaniko/
      policy: pull-push
  before_script:
    - apk add --no-cache bash crane git
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-container-build.sh verify
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

01-e2e:
  stage: verify
  needs:
    - job: 01-build
      artifacts: true
    - job: 03-package
      artifacts: false
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
  cache:
    - key: swirl-website-npm-v1
      paths:
        - .cache/npm/
      policy: pull
  script:
    - npm ci --no-fund --prefer-offline
    - npm run test:e2e
  artifacts:
    name: "swirl-website-e2e-$CI_COMMIT_SHORT_SHA"
    expose_as: "Playwright E2E report"
    when: always
    expire_in: 7 days
    paths:
      - e2e-results/
    reports:
      junit: e2e-results/junit.xml
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

02-quality:
  stage: verify
  needs:
    - job: 02-test
      artifacts: true
  image:
    name: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    entrypoint: [""]
  cache:
    - key: swirl-website-sonar-v1
      paths:
        - .cache/sonar/cache/
      policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates
    - export APP_VERSION="$("$CI_PROJECT_DIR/infra/scripts/current-version.sh")"
    - npm ci --no-fund --prefer-offline
    - npm install --global @sonar/scan@5.0.2
  script:
    - bash infra/scripts/test-quality.sh
    - bash infra/scripts/ci-quality.sh
  allow_failure: true
  artifacts:
    name: "swirl-website-quality-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - quality-reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

03-security:
  stage: verify
  image:
    name: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .cache/trivy
    TRIVY_DISABLE_TELEMETRY: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: 10m
  cache:
    - key: swirl-website-trivy-v1
      paths:
        - .cache/trivy/
      policy: pull-push
  script:
    - mkdir -p security-reports
    - trivy fs --offline-scan --include-dev-deps --scanners vuln,misconfig,secret --skip-dirs '**/.git' --skip-dirs '**/.cache' --skip-dirs '**/node_modules' --skip-dirs '**/dist' --skip-dirs '**/coverage' --skip-dirs '**/e2e-results' --format json --output security-reports/trivy.json .
    - trivy convert --scanners vuln,misconfig,secret --format sarif --output security-reports/trivy.sarif security-reports/trivy.json
    - trivy convert --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --format table --exit-code 1 security-reports/trivy.json
  allow_failure: true
  artifacts:
    name: "swirl-website-security-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - security-reports/
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

01-release:
  stage: release
  needs:
    - job: 01-build
      artifacts: true
    - job: 03-package
      artifacts: false
    - job: 01-e2e
      artifacts: false
  image:
    name: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: [""]
  cache:
    - key: swirl-website-kaniko-executor-v1
      paths:
        - .cache/kaniko/
      policy: pull-push
  resource_group: swirl-website-production
  interruptible: false
  before_script:
    - apk add --no-cache bash crane curl git jq
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-release.sh publish
  artifacts:
    name: "swirl-website-release-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - release.env
  manual_confirmation: "Release the successful Swirl Website build for $CI_COMMIT_SHORT_SHA?"
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "full"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $APP_ONBOARDING == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

02-deploy:
  stage: release
  needs:
    - job: 01-release
      artifacts: true
  image:
    name: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: [""]
  resource_group: swirl-website-production
  interruptible: false
  before_script:
    - apk add --no-cache bash ca-certificates curl git jq kubectl
  script:
    - infra/scripts/ci-release.sh deploy
  environment:
    name: production
    url: https://swirlit.dev
    deployment_tier: production
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

set-major-version:
  stage: version
  image:
    name: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: [""]
  needs: []
  dependencies: []
  resource_group: swirl-website-production
  interruptible: false
  before_script:
    - apk add --no-cache bash git
  script:
    - infra/scripts/ci-set-major-version.sh
  manual_confirmation: "Set the next Swirl Website major version from NEW_MAJOR_VERSION?"
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
