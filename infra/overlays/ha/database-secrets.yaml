# Provision and wait for these before selecting the HA Argo CD path: PreSync
# hooks run before normal resources, including new ExternalSecrets, are synced.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website-database
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: website-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/website/database
        property: DATABASE_URL
    - secretKey: WEBSITE_DB_PASSWORD
      remoteRef:
        key: apps/website/database
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website-db-admin-credentials
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: website-db-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password
