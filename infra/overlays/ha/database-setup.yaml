apiVersion: batch/v1
kind: Job
metadata:
  name: swirl-website-db-setup
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '-2'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: swirl-website-registry-auth
      containers:
        - name: db-setup
          image: registry.swirlit.dev/swirlit/swirl-website/site:bootstrap
          command: [node, dist/runtime/provision-postgres.js]
          envFrom:
            - secretRef:
                name: swirl-website-db-admin-credentials
          env:
            - name: SWIRL_WEBSITE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swirl-website-database
                  key: SWIRL_WEBSITE_DB_PASSWORD
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: swirl-website-schema-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '-1'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: swirl-website-registry-auth
      containers:
        - name: schema-migration
          image: registry.swirlit.dev/swirlit/swirl-website/site:bootstrap
          command: [node, dist/runtime/migrate-postgres.js, --initialize]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: swirl-website-database
                  key: DATABASE_URL
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
