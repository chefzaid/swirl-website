apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website-gitlab-repository
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: website-gitlab-repository
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: http://gitlab.swirlit.internal/swirlit/website.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/website/registry
        property: username
    - secretKey: password
      remoteRef:
        key: apps/website/registry
        property: password
