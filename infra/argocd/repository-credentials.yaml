apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: swirl-website-gitlab-repository
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: swirl-website-gitlab-repository
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: http://gitlab.swirl.internal/swirl/swirl-website.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/swirl-website/registry
        property: username
    - secretKey: password
      remoteRef:
        key: apps/swirl-website/registry
        property: password
