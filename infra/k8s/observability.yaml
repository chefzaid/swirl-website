---
apiVersion: batch/v1
kind: Job
metadata:
  name: swirl-website-kibana-bootstrap
  namespace: apps
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: swirl-website-kibana-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-saved-objects
          image: docker.io/curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          command:
            - sh
            - -c
            - |
              set -eu
              until curl --connect-timeout 5 --max-time 15 -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" \
                http://kibana.swirlit.internal:5601/api/status >/dev/null; do sleep 5; done
              response="$(curl --connect-timeout 5 --max-time 60 -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" -X POST \
                -H 'kbn-xsrf: swirl-website-observability-bootstrap' \
                -F file=@/saved-objects/swirl-website.ndjson \
                'http://kibana.swirlit.internal:5601/api/saved_objects/_import?overwrite=true')"
              echo "$response"
              echo "$response" | grep -q '"success":true'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: saved-objects
              mountPath: /saved-objects
              readOnly: true
      volumes:
        - name: saved-objects
          configMap:
            name: swirl-website-kibana-saved-objects
