apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  annotations:
    gethomepage.dev/description: Swirl company website
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://swirlit.dev
    gethomepage.dev/icon: mdi-web
    gethomepage.dev/name: Swirl
    gethomepage.dev/weight: "10"
    gethomepage.dev/pod-selector: app=website
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: apps-website-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swirlit.dev
        - www.swirlit.dev
      secretName: swirlit-dev-tls
  rules:
    - host: swirlit.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
    - host: www.swirlit.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: website-upload-limit
spec:
  buffering:
    maxRequestBodyBytes: 18432
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: website-backend
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 30s
