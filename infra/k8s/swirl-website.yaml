apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swirl-website-data
  labels:
    app: swirl-website
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swirl-website
  labels:
    app: swirl-website
spec:
  # The contact database uses one SQLite writer on one persistent volume.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: swirl-website
  template:
    metadata:
      labels:
        app: swirl-website
        # Admits this pod to Odoo's in-cluster lead intake API.
        swirl-cloud.io/odoo-crm-intake: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: swirl-website-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: swirl-website
          image: registry.swirlit.dev/swirlit/swirl-website/site:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: PUBLIC_ORIGIN
              value: https://swirlit.dev
            - name: PUBLIC_ALIAS_HOST
              value: www.swirlit.dev
            - name: CONTACT_SENDER
              value: noreply@swirlit.dev
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swirl-website-contact-email
                  key: RESEND_API_KEY
                  # Keep storage available while email is being configured.
                  optional: true
            # Odoo CRM lead delivery; inquiries stay queued until it is configured.
            - name: ODOO_URL
              valueFrom:
                secretKeyRef:
                  name: swirl-website-odoo
                  key: ODOO_URL
                  optional: true
            - name: ODOO_DATABASE
              valueFrom:
                secretKeyRef:
                  name: swirl-website-odoo
                  key: ODOO_DATABASE
                  optional: true
            - name: ODOO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swirl-website-odoo
                  key: ODOO_API_KEY
                  optional: true
            # Ingress overwrites X-Real-IP; arbitrary forwarded headers from
            # sockets outside the cluster pod network remain untrusted.
            - name: TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: swirl-website-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: swirl-website
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: apps-swirl-website-backend@kubernetescrd
  labels:
    app: swirl-website
spec:
  type: ClusterIP
  selector:
    app: swirl-website
  ports:
    - name: http
      port: 80
      targetPort: http
