apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swirl-website-delivery-observer
  namespace: apps
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - swirl-website
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swirl-website-delivery-observer
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swirl-website-delivery-observer
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-job
    namespace: gitlab-runners
