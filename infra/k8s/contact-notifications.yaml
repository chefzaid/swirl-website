apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website-contact-email
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: website-contact-email
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: apps/website/contact
        property: RESEND_API_KEY
