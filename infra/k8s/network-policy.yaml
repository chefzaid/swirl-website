apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swirl-website-ingress
spec:
  podSelector:
    matchLabels:
      app: swirl-website
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-runners
          podSelector:
            matchLabels:
              app: gitlab-ci-job
      ports:
        - protocol: TCP
          port: 8080
